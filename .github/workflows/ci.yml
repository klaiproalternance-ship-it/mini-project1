name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov
        
    - name: Lint with flake8
      run: |
        # Arrête le build s'il y a des erreurs de syntaxe
        flake8 api/ dashboard/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Les autres avertissements ne bloquent pas le build
        flake8 api/ dashboard/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        python -m pytest tests/ -v --cov=api --cov-fail-under=70
        
  docker-build:
    runs-on: ubuntu-latest
    needs: test # Le build Docker ne se lance que si les tests passent
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker images
      run: |
        docker compose build
